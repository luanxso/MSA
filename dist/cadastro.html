<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><script src="assets/theme.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="Cadastro para o sistema de acompanhamento e gestão da produção da MSA do Brasil.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='3'%20fill='%23009534'/%3E%3Cpath%20d='M7%2023V9l9%209%209-9v14'%20fill='none'%20stroke='white'%20stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/Barlow-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/login-layout.css">
  <script src="assets/config.js" defer></script>
  <script src="assets/rbac.js" defer></script>
  <script src="assets/validation.js" defer></script>
  <script src="assets/firebase-config.js" defer></script>
  <script src="assets/firebase-client.js" defer></script>
  <script src="assets/auth-service.js" defer></script>
  <script src="assets/auth-ui.js" defer></script>
  <title>Criar cadastro | MSA do Brasil</title>
<link rel="stylesheet" href="assets/theme.css"></head>
<body class="auth-page" data-page="cadastro">
  <a class="skip" href="#auth-form">Ir para o formulário</a>
  <div class="auth-layout">
    <main class="form-panel login-card register" aria-labelledby="form-title">
      <header class="auth-masthead">
        <div class="brand-row">
          <img class="msa-logo" src="assets/msa-logo.png" alt="MSA — The Safety Company" width="901" height="430">
        </div>
      </header>
      <div class="form-content">
        <section id="form-section" aria-labelledby="form-title">
          <header class="form-heading">
            <h1 id="form-title">Criar cadastro</h1>
            <p>Preencha seus dados para criar sua conta.</p>
          </header>
          <div id="form-banner" class="banner" role="status" aria-live="polite" hidden></div>
          <form id="auth-form" aria-labelledby="form-title" tabindex="-1" novalidate>
            <div class="field">
              <label for="nome">Nome</label>
              <input id="nome" name="nome" type="text" placeholder="Informe seu nome" autocomplete="name" aria-describedby="nome-error" aria-invalid="false" required maxlength="120">
              <p id="nome-error" class="error" hidden></p>
            </div>
            <div class="two-fields">
              <div class="field">
                <label for="re">RE</label>
                <input id="re" name="re" type="text" placeholder="Informe seu RE" autocomplete="username" aria-describedby="re-error re-hint" aria-invalid="false" required inputmode="numeric" maxlength="10">
                <p class="hint" id="re-hint">Registro do funcionário</p>
                <p id="re-error" class="error" hidden></p>
              </div>
              <div class="field">
                <label for="cargo">Cargo</label>
                <select id="cargo" name="cargo" required aria-invalid="false" aria-describedby="cargo-error role-hint"><option value="">Selecione seu cargo</option></select>
                <p id="cargo-error" class="error" hidden></p>
              </div>
            </div>
            <p class="role-hint" id="role-hint" aria-live="polite">Você registra a operação da máquina em uso.</p>
            <div class="field">
              <label for="senha">Senha</label>
              <div class="input-wrap">
                <input id="senha" name="senha" type="password" placeholder="Crie sua senha" autocomplete="new-password" aria-describedby="senha-hint senha-error" aria-invalid="false" required maxlength="64" minlength="6">
                <button type="button" class="toggle-password" data-password="senha" aria-label="Mostrar senha" aria-pressed="false">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
              <p class="caps-note" hidden>Caps Lock está ativado.</p>
              <p class="hint" id="senha-hint">Mínimo de 6 caracteres.</p>
              <p id="senha-error" class="error" hidden></p>
            </div>
            <button class="primary" type="submit" data-label="Cadastrar e entrar"><span class="button-label">Cadastrar e entrar</span></button>
          </form>
          <p class="account-link"><span>Já tem cadastro?</span> <a href="index.html">Entrar</a></p>
        </section>
      </div>
    </main>
  </div>
  <noscript><p>Ative o JavaScript para utilizar os formulários.</p></noscript>
</body>
</html>
